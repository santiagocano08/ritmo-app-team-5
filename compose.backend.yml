# ---------------------------------------------------------------------------
# PulsoFlota — BACKEND stack (one of four independent compose projects)
#
#   api — FastAPI read API (uvicorn)
#
# Needs the data stack (`db`) on the shared network `pulsoflota-net`:
#
#   docker compose -f compose.data.yml up -d --build      # first
#   docker compose -f compose.backend.yml up -d --build
#
# The service keeps the name `api` so the frontend proxy (deploy/frontend/nginx.conf)
# finds it on the shared network.
# ---------------------------------------------------------------------------

name: pulsoflota-backend

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      python -m uvicorn src.api.main:app
      --host 0.0.0.0
      --port ${API_PORT:-8000}
      --no-access-log
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app
    ports:
      - "${API_HOST_PORT:-${API_PORT:-8000}}:${API_PORT:-8000}"
    networks:
      - pulsoflota
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${API_PORT:-8000}/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

networks:
  pulsoflota:
    name: pulsoflota-net
    external: true
