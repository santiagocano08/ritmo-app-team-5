# ---------------------------------------------------------------------------
# PulsoFlota — DATA GENERATOR stack (one of four independent compose projects)
#
#   ingestion — simulator stdout piped into the ingestion reader (writes bronze)
#
# Needs the data stack (`db`) on the shared network `pulsoflota-net`:
#
#   docker compose -f compose.data.yml up -d --build      # first
#   docker compose -f compose.generator.yml up -d --build
#
# There is no depends_on across compose projects. If db is not ready yet, the
# ingestion retry loop (INGESTION_RETRY_*) waits for it and restart:
# unless-stopped covers an exhausted retry window.
# ---------------------------------------------------------------------------

name: pulsoflota-generator

services:

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    # Single line: a folded (>) scalar keeps the newline before "|", which breaks the pipe.
    command: ["sh", "-c", "python -m src.data.simulator.main --seed ${SIM_SEED:-42} --duration ${SIM_DURATION_S:-3600} --pace ${SIM_PACE_S:-1} | python -m src.data.ingestion.run"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SIM_PLANNED_HEADWAY_S: ${SIM_PLANNED_HEADWAY_S:-600}
      SIM_SCENARIO_FILE: ${SIM_SCENARIO_FILE:-}
      SIM_TRUTH_PATH: ${SIM_TRUTH_PATH:-}
      SIM_HOLDS: ${SIM_HOLDS:-off}
      SIM_HOLD_POLL_S: ${SIM_HOLD_POLL_S:-1}
      SIM_HOLD_NONCOMPLIANCE: ${SIM_HOLD_NONCOMPLIANCE:-0.10}
      SIM_DEMAND_SCALE: ${SIM_DEMAND_SCALE:-1.0}
      INGESTION_RETRY_INITIAL_S: ${INGESTION_RETRY_INITIAL_S:-1}
      INGESTION_RETRY_MAX_WAIT_S: ${INGESTION_RETRY_MAX_WAIT_S:-5}
      INGESTION_RETRY_TOTAL_S: ${INGESTION_RETRY_TOTAL_S:-120}
      INGESTION_HEALTH_MAX_AGE_S: ${INGESTION_HEALTH_MAX_AGE_S:-15}
      PYTHONPATH: /app
    networks:
      - pulsoflota
    healthcheck:
      test: ["CMD", "python", "-m", "src.data.ingestion.health"]
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 20s
    restart: unless-stopped

networks:
  pulsoflota:
    name: pulsoflota-net
    external: true
