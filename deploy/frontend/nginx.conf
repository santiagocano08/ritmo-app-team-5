load_module modules/ngx_http_headers_more_filter_module.so;

worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Temp paths under /tmp so the non-root UID 10001 runtime user can write them.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    access_log /dev/stdout;
    sendfile   on;
    keepalive_timeout 65;

    # Hide the stack: no "Server: nginx/x.y.z" version banner (FR-012, SC-005).
    server_tokens off;

    # Docker's embedded DNS resolver. Using it with a variable proxy_pass defers
    # upstream name resolution to request time, so nginx -t and container startup
    # do not fail if `api` is briefly unresolvable, and a mid-session backend blip
    # is handled per-request (FR-008) instead of crashing the proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        # Unprivileged port so the server runs as non-root UID 10001 (FR-010).
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Mandatory security headers, verbatim from research R3 / security.md A02 (FR-012, SC-005).
        # 'always' so they are sent on error responses too.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # Strip stack-revealing headers so no technology/version string leaks (FR-012,
        # SC-005). `more_clear_headers` removes Nginx's own Server header (server_tokens
        # off only drops the version); proxy_hide_header drops the upstream's banners.
        more_clear_headers "Server";
        more_clear_headers "X-Powered-By";
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        # Same-origin backend forward: the SPA's default relative base /api/v1 (FR-011).
        # The `api` service name in a variable so it resolves at request time via the
        # resolver above (see note), not once at startup.
        location /api/v1/ {
            set $api_upstream api;
            proxy_pass http://$api_upstream:8000$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA fallback: serve index.html for client-side routes.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
