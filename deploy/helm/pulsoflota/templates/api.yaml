apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pulsoflota.fullname" . }}-api
  labels:
    {{- include "pulsoflota.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "pulsoflota.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pulsoflota.labels" . | nindent 8 }}
        {{- include "pulsoflota.selector" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- include "pulsoflota.podSecurity" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "pulsoflota.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - uvicorn
            - src.api.main:app
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.api.port | quote }}
            - --no-access-log
          env:
            {{- include "pulsoflota.dbEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          # /healthz does not touch the database, so it is safe for liveness too.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            {{- include "pulsoflota.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulsoflota.fullname" . }}-api
  labels:
    {{- include "pulsoflota.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "pulsoflota.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
      {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
