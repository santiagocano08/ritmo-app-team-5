{{- $name := include "pulsoflota.dbHost" . }}
# db-init scripts: copy of db/init/*.sql (Helm cannot read files outside the chart; CI checks
# that both copies match). PostgreSQL runs them only when the data volume is empty.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-init
  labels:
    {{- include "pulsoflota.labels" . | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "files/db-init/*.sql" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "pulsoflota.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "pulsoflota.selector" (dict "root" . "component" "db") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "pulsoflota.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "pulsoflota.selector" (dict "root" . "component" "db") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pulsoflota.labels" . | nindent 8 }}
        {{- include "pulsoflota.selector" (dict "root" . "component" "db") | nindent 8 }}
    spec:
      securityContext:
        # The official postgres image supports running as its own non-root user (999).
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.db.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.db.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.db.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.existingSecret }}
                  key: POSTGRES_PASSWORD
            # Subdirectory: the volume root may contain lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: init
          configMap:
            name: {{ $name }}-init
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.db.storage }}
