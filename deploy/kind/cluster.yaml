# kind cluster for PulsoFlota. NodePorts are mapped to host ports that do not clash with
# docker-compose (8080 web, 8000 api, 5432 db), so both can run at the same time.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pulsoflota
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # web
        hostPort: 8180
        listenAddress: "127.0.0.1"
      - containerPort: 30800   # api
        hostPort: 8100
        listenAddress: "127.0.0.1"
