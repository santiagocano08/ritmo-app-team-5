# ---------------------------------------------------------------------------
# PulsoFlota — Turn-1 docker-compose
#
# Three isolated services per Principle III (Constitution §III):
#   db        — PostgreSQL 16 (persistence only)
#   ingestion — simulator stdout → ingestion reader (keeps writing even if
#               api is down; this is the isolation invariant of T009)
#   api       — FastAPI health-only endpoint
#
# Stopping 'api' does NOT stop 'ingestion': they are separate services with
# no depends_on relationship from ingestion to api.
#
# Secrets: ALL credentials come from environment variables.  Copy .env.example
# to .env and set POSTGRES_PASSWORD before starting.  No secrets are
# hard-coded here or in any committed file (.env is git-ignored).
#
# If POSTGRES_PASSWORD is not set the stack will fail to start cleanly
# (postgres refuses to initialise without it).
#
# Turn-1 scope (docs/turns-ritmo.md §3.3 deferred norms):
#   - No Redis / database-redis service (deferred to turn 3)
#   - No PostGIS (deferred to turn 3)
#   - No production hardening (reverse proxy, HSTS, SCA) — turn 2/3
#   - Non-root UID 10001 is applied in the Dockerfile (trivial, included)
# ---------------------------------------------------------------------------

services:

  # --------------------------------------------------------------------------
  # db — PostgreSQL 16
  # Mounts src/data/db/init/ scripts into /docker-entrypoint-initdb.d/ so the schemas
  # and bronze tables are created on first start.  Scripts are idempotent
  # (IF NOT EXISTS guards) so container restarts are safe.
  # --------------------------------------------------------------------------
  db:
    image: postgres:16.11
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (cp .env.example .env)}
    volumes:
      - ./src/data/db/init:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # ingestion — simulator stdout piped into ingestion reader.
  # This service is intentionally independent of 'api': stopping api does NOT
  # propagate here (Principle III).  It depends only on db being healthy.
  # Entry-point: sh -c so the pipe works in a shell.
  # SIM_SEED and SIM_DURATION_S are read from the environment / .env file.
  # --------------------------------------------------------------------------
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    # Single line: a folded (>) scalar keeps the newline before "|", which breaks the pipe.
    command: ["sh", "-c", "python -m src.data.simulator.main --seed ${SIM_SEED:-42} --duration ${SIM_DURATION_S:-3600} --pace ${SIM_PACE_S:-1} | python -m src.data.ingestion.run"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SIM_PLANNED_HEADWAY_S: ${SIM_PLANNED_HEADWAY_S:-600}
      INGESTION_RETRY_INITIAL_S: ${INGESTION_RETRY_INITIAL_S:-1}
      INGESTION_RETRY_MAX_WAIT_S: ${INGESTION_RETRY_MAX_WAIT_S:-5}
      INGESTION_RETRY_TOTAL_S: ${INGESTION_RETRY_TOTAL_S:-120}
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # api — FastAPI health-only endpoint (uvicorn).
  # Isolated from ingestion: stopping this service has no effect on the
  # ingestion container.
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      python -m uvicorn src.api.main:app
      --host 0.0.0.0
      --port ${API_PORT:-8000}
      --no-access-log
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${API_PORT:-8000}/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # refresh — gold refresh loop (feature 002, R16). Recomputes the snapshot every
  # REFRESH_INTERVAL_S and sends one NOTIFY per new snapshot. Off the capture path:
  # depends only on db, and nothing depends on it, so stopping it never stops
  # ingestion (FR-041, Principle III).
  # Healthcheck = freshness: unhealthy when no gold snapshot was committed in the
  # last REFRESH_HEALTH_MAX_AGE_S seconds (also shows a whole-feed stop in data mode).
  # --------------------------------------------------------------------------
  refresh:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    command: ["python", "-m", "src.data.refresh.run"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REFRESH_CLOCK: ${REFRESH_CLOCK:-data}
      REFRESH_INTERVAL_S: ${REFRESH_INTERVAL_S:-5}
      REFRESH_HEALTH_MAX_AGE_S: ${REFRESH_HEALTH_MAX_AGE_S:-30}
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "src.data.refresh.health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # tests — runs the full pytest suite inside the app image.
  # Profile: 'tools' — only started explicitly with:
  #   docker compose --profile tools run --rm tests
  # Requires DATABASE_URL to point at the running db service.
  # --------------------------------------------------------------------------
  tests:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    profiles:
      - tools
    command: >
      python -m pytest src/data/tests tests -p no:cacheprovider --cov=src --cov-report=term-missing --cov-fail-under=80
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_BASE_URL: http://api:${API_PORT:-8000}
      PYTHONPATH: /app
      COVERAGE_FILE: /tmp/.coverage
    # tests/, src/data/tests/, contracts/ and data/ are excluded from the image
    # (.dockerignore); mount them read-only so the suite runs on the same image
    # that is deployed.
    volumes:
      - ./tests:/app/tests:ro
      - ./src/data/tests:/app/src/data/tests:ro
      - ./contracts:/app/contracts:ro
      - ./data:/app/data:ro
      # Phase 0 (002): read-only inputs for the throwaway-DB fixture (R10) and the
      # config/compose/ADR/spec checks of T002, T008 and T016.
      - ./specs:/app/specs:ro
      - ./docs/adr:/app/docs/adr:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      # Phase 1b (003): the container pin test reads the Dockerfile.
      - ./Dockerfile:/app/Dockerfile:ro
      - ./.env.example:/app/.env.example:ro
      # Feature 003: the workflow structure test and the ops-docs test read these.
      - ./.github/workflows:/app/.github/workflows:ro
      - ./docs/ops:/app/docs/ops:ro
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  db_data:
