<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>PulsoFlota deployment</title>
  <desc>The whole stack runs in Docker Compose on one host. Two ports are exposed through a tunnel on a server and published by Cloudflare: the dispatcher console and the simulation console.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3A4250"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7E22CE"/>
    </marker>
    <style>
      .t { font-size: 14px; font-weight: 700; fill: #12161C; }
      .s { font-size: 11.5px; fill: #3A4250; }
      .lbl { font-size: 12px; font-weight: 700; fill: #4A5361; letter-spacing: .04em; }
      .tag { font-size: 11.5px; font-weight: 600; fill: #12161C; }
      .host { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 1.5; }
      .server { fill: #FDF2F8; stroke: #F472B6; stroke-width: 1.5; }
      .data { fill: #DBEAFE; stroke: #1D4ED8; stroke-width: 1.5; }
      .app { fill: #EDE9FE; stroke: #6D28D9; stroke-width: 1.5; }
      .back { fill: #DCFCE7; stroke: #166534; stroke-width: 1.5; }
      .sim { fill: #FEF3C7; stroke: #B45309; stroke-width: 1.5; }
      .edge { fill: #FFF7ED; stroke: #EA580C; stroke-width: 1.5; }
      .pub { fill: #E0F2FE; stroke: #0369A1; stroke-width: 1.5; }
      .pill { fill: #F1F3F6; stroke: #A3ACB9; stroke-width: 1; }
      .frame { fill: none; stroke: #94A3B8; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .ln { stroke: #3A4250; stroke-width: 1.6; fill: none; }
      .pl { stroke: #7E22CE; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect width="1000" height="690" fill="#FFFFFF"/>

  <text x="20" y="34" font-size="20" font-weight="700" fill="#14213D">PulsoFlota · deployment</text>
  <text x="20" y="54" class="s">One Docker host, two ports published through a tunnel and Cloudflare</text>

  <!-- host -->
  <rect x="20" y="72" width="580" height="500" rx="14" class="host"/>
  <text x="38" y="98" class="lbl">HOST MACHINE · DOCKER COMPOSE</text>

  <rect x="40" y="116" width="160" height="78" rx="10" class="sim"/>
  <text x="120" y="146" text-anchor="middle" class="t">ingestion</text>
  <text x="120" y="164" text-anchor="middle" class="s">simulator → validation</text>
  <text x="120" y="180" text-anchor="middle" class="s">writes bronze</text>

  <rect x="230" y="116" width="160" height="78" rx="10" class="data"/>
  <text x="310" y="146" text-anchor="middle" class="t">db</text>
  <text x="310" y="164" text-anchor="middle" class="s">PostgreSQL 16</text>
  <text x="310" y="180" text-anchor="middle" class="s">bronze · silver · gold</text>

  <rect x="420" y="116" width="160" height="78" rx="10" class="back"/>
  <text x="500" y="146" text-anchor="middle" class="t">refresh</text>
  <text x="500" y="164" text-anchor="middle" class="s">silver + gold every 5 s</text>
  <text x="500" y="180" text-anchor="middle" class="s">decision model</text>

  <path d="M200 155 H228" class="ln" marker-end="url(#a)"/>
  <path d="M420 145 H392" class="ln" marker-end="url(#a)"/>
  <path d="M392 166 H418" class="ln" marker-end="url(#a)"/>

  <rect x="230" y="256" width="160" height="78" rx="10" class="back"/>
  <text x="310" y="286" text-anchor="middle" class="t">api</text>
  <text x="310" y="304" text-anchor="middle" class="s">FastAPI · /api/v1</text>
  <text x="310" y="320" text-anchor="middle" class="s">reads gold</text>
  <path d="M310 256 V196" class="ln" marker-end="url(#a)"/>

  <rect x="420" y="256" width="160" height="78" rx="10" class="app"/>
  <text x="500" y="286" text-anchor="middle" class="t">frontend</text>
  <text x="500" y="304" text-anchor="middle" class="s">Nginx: React SPA</text>
  <text x="500" y="320" text-anchor="middle" class="s">+ /api/v1 proxy</text>
  <path d="M420 295 H392" class="ln" marker-end="url(#a)"/>

  <text x="40" y="270" class="s" font-weight="700">Principle III</text>
  <text x="40" y="288" class="s">ingestion depends only on db;</text>
  <text x="40" y="304" class="s">stopping api or frontend never</text>
  <text x="40" y="320" class="s">stops capture.</text>

  <!-- sim -->
  <rect x="40" y="396" width="350" height="150" rx="12" class="frame"/>
  <text x="56" y="420" class="lbl">PFSIM · ISOLATED COPY OF THE STACK</text>
  <text x="56" y="444" class="s">Same services, own database and ports</text>
  <text x="56" y="462" class="s">(dispatcher console on :58080).</text>
  <text x="56" y="486" class="s">Every simulation run resets it, so a seed</text>
  <text x="56" y="504" class="s">always replays the same stream; runs are</text>
  <text x="56" y="522" class="s">archived before each reset.</text>

  <rect x="420" y="420" width="160" height="96" rx="10" class="sim"/>
  <text x="500" y="448" text-anchor="middle" class="t">sim console</text>
  <text x="500" y="466" text-anchor="middle" class="s">:8090 · runs, countdown</text>
  <text x="500" y="482" text-anchor="middle" class="s">/lab/: flow, decisions,</text>
  <text x="500" y="498" text-anchor="middle" class="s">results</text>
  <path d="M420 468 H392" class="pl" marker-end="url(#p)"/>

  <!-- server -->
  <rect x="700" y="72" width="280" height="148" rx="14" class="server"/>
  <text x="718" y="98" class="lbl">SERVER</text>
  <rect x="730" y="118" width="220" height="80" rx="10" class="app"/>
  <text x="840" y="152" text-anchor="middle" class="t">Tunnel</text>
  <text x="840" y="172" text-anchor="middle" class="s">outbound only, no open inbound port</text>
  <path d="M840 220 V258" class="ln" marker-end="url(#a)"/>

  <rect x="730" y="260" width="220" height="60" rx="10" class="edge"/>
  <text x="840" y="286" text-anchor="middle" class="t">Cloudflare</text>
  <text x="840" y="304" text-anchor="middle" class="s">DNS + TLS + edge</text>
  <path d="M825 320 V378" class="ln" marker-end="url(#a)"/>
  <path d="M950 290 H972 V505 H952" class="ln" marker-end="url(#a)"/>

  <rect x="700" y="380" width="250" height="70" rx="12" class="pub"/>
  <text x="825" y="406" text-anchor="middle" class="t">pulsoflota.zandex.party</text>
  <text x="825" y="425" text-anchor="middle" class="s">dispatcher console (/#live)</text>
  <text x="825" y="441" text-anchor="middle" class="s">← Port 1 · frontend</text>

  <rect x="700" y="470" width="250" height="70" rx="12" class="pub"/>
  <text x="825" y="496" text-anchor="middle" class="t">pulsoflotadata.zandex.party</text>
  <text x="825" y="515" text-anchor="middle" class="s">simulation &amp; test lab (/lab/#res)</text>
  <text x="825" y="531" text-anchor="middle" class="s">← Port 2 · sim console</text>

  <!-- ports -->
  <path d="M580 295 C 640 295, 640 150, 728 150" class="ln" marker-end="url(#a)"/>
  <rect x="604" y="230" width="78" height="22" rx="11" class="pill"/>
  <text x="643" y="245" text-anchor="middle" class="tag">Port 1</text>
  <path d="M580 468 C 660 468, 650 178, 728 178" class="ln" marker-end="url(#a)"/>
  <rect x="604" y="400" width="78" height="22" rx="11" class="pill"/>
  <text x="643" y="415" text-anchor="middle" class="tag">Port 2</text>

  <!-- legend -->
  <path d="M40 606 H90" class="ln" marker-end="url(#a)"/>
  <text x="100" y="610" class="s">data and requests between services</text>
  <path d="M40 632 H90" class="pl" marker-end="url(#p)"/>
  <text x="100" y="636" class="s">simulation control (sim console → pfsim)</text>
  <path d="M380 606 H430" class="ln" marker-end="url(#a)"/>
  <text x="440" y="610" class="s">exposure through the tunnel</text>
  <rect x="380" y="625" width="14" height="14" rx="3" class="sim"/>
  <text x="402" y="636" class="s">data / simulation</text>
  <rect x="520" y="625" width="14" height="14" rx="3" class="back"/>
  <text x="542" y="636" class="s">backend</text>
  <rect x="610" y="625" width="14" height="14" rx="3" class="app"/>
  <text x="632" y="636" class="s">web / tunnel</text>
  <rect x="720" y="625" width="14" height="14" rx="3" class="data"/>
  <text x="742" y="636" class="s">database</text>
</svg>
