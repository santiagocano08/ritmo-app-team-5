[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulsoflota"
version = "0.1.0"
description = "PulsoFlota — Turn-1 base simulator and ingestion pipeline"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1,<4",
    "pydantic>=2.5,<3",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "datamodel-code-generator>=0.25,<1",
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "httpx>=0.27,<1",
    "jsonschema>=4.21,<5",
    "rfc3339-validator>=0.1.4,<1",
    "PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pulsoflota", "src/reference", "src/ingestion", "src/simulator", "src/api", "src/rules", "src/pipeline", "src/refresh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=src --cov-report=term-missing --cov-fail-under=60"
markers = [
    "slow: long-running checks (for example the 60-minute replay of SC-001)",
    "live: checks that need the running compose stack and real wall-clock time",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/pulsoflota/models/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
